<!doctype html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>阻尼回弹</title>
	<link rel="stylesheet" href="index.css">
</head>
<body>
	<main>
		<div id="box">
			<img src="res/0.png" alt="">
		</div>
		
		<!-- 控制面板 -->
		<div id="control-panel">
			<h2>阻尼回弹参数控制</h2>
			
			<div class="control-group">
				<label for="stiffness">刚度 (Stiffness): <span id="stiffness-value">300</span></label>
				<div class="input-wrapper">
					<input type="range" id="stiffness" class="slider" min="1" max="1000" value="300">
					<input type="number" id="stiffness-input" class="number-input" min="1" max="1000" value="300">
				</div>
			</div>
			
			<div class="control-group">
				<label for="damping">阻尼 (Damping): <span id="damping-value">25</span></label>
				<div class="input-wrapper">
					<input type="range" id="damping" class="slider" min="1" max="100" value="25">
					<input type="number" id="damping-input" class="number-input" min="1" max="100" value="25">
				</div>
			</div>
			
			<div class="control-group">
				<label for="mass">质量 (Mass): <span id="mass-value">1</span></label>
				<div class="input-wrapper">
					<input type="range" id="mass" class="slider" min="0.1" max="10" step="0.1" value="1">
					<input type="number" id="mass-input" class="number-input" min="0.1" max="10" step="0.1" value="1">
				</div>
			</div>
			
			<div class="control-group">
				<label for="precision">精度 (Precision): <span id="precision-value">0.1</span></label>
				<div class="input-wrapper">
					<input type="range" id="precision" class="slider" min="0.01" max="1" step="0.01" value="0.1">
					<input type="number" id="precision-input" class="number-input" min="0.01" max="1" step="0.01" value="0.1">
				</div>
			</div>
			
			<div class="button-group">
				<button id="start-btn">开始</button>
				<button id="reset-btn">重置</button>
			</div>
		</div>
	</main>
</body>
<script src="./index.js" type="module"></script>
</html>
